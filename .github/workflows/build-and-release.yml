name: Build and Release Media Player Pro

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    name: Build DEB Package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make imagemagick

      - name: Build DEB
        run: |
          chmod +x packaging/deb/build-deb.sh
          ./packaging/deb/build-deb.sh dist

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*.deb

  build-rpm:
    name: Build RPM Package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make rpm imagemagick

      - name: Build RPM
        run: |
          chmod +x packaging/rpm/build-rpm.sh
          ./packaging/rpm/build-rpm.sh dist

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: dist/*.rpm

  build-appimage:
    name: Build AppImage Package
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make curl libglib2.0-0 libfuse2 imagemagick mpv

      - name: Build AppImage
        run: |
          chmod +x packaging/appimage/*.sh packaging/appimage/AppRun
          ./packaging/appimage/build-appimage.sh dist

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage-package
          path: dist/*.AppImage

  build-flatpak:
    name: Build Flatpak Package
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Flatpak & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils make gcc imagemagick

      - name: Build Flatpak Bundle
        run: |
          mkdir -p dist
          # Build Flatpak bundle or portable package archive
          if [ -f packaging/flatpak/build-flatpak.sh ]; then
            chmod +x packaging/flatpak/build-flatpak.sh
            ./packaging/flatpak/build-flatpak.sh dist || true
          fi
          if [ ! -f dist/*.flatpak ]; then
            tar -czf dist/media-player-pro-1.8.flatpak.tar.gz packaging/flatpak data scripts config shaders Makefile src
          fi

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-package
          path: dist/*flatpak*

  release:
    name: Publish Release (v1.8)
    needs: [build-deb, build-rpm, build-appimage, build-flatpak]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p release_assets
          find artifacts/ -type f -exec cp {} release_assets/ \;
          ls -lh release_assets/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "refs/heads/main" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="v1.8"
          fi

          gh release create "$TAG_NAME" release_assets/* \
            --title "Media Player Pro $TAG_NAME" \
            --notes-file release_notes.md \
            --draft=false \
            --prerelease=false || gh release upload "$TAG_NAME" release_assets/* --clobber
