# Media Player Pro - Core Configuration (v1.1)

# Disable default mpv OSC to use Media Player Pro Frosted Glass Skin
osc=no

# Window and Application Identity
title=Media Player Pro - ${media-title:${filename}}
x11-name=media-player-pro
wayland-app-id=media-player-pro

# Autohide cursor after 3 seconds of non-touch during playback
cursor-autohide=3000
cursor-autohide-fs-only=no

# Hardware Acceleration & High-Performance Video Output
vo=gpu-next,gpu
gpu-api=auto
hwdec=auto-safe

# Window Sizing & Positioning
autofit-larger=90%x90%
geometry=50%:50%
keep-open=yes

# High Quality Defaults
dscale=mitchell
cscale=ewa_lanczos
correct-downscaling=yes
sigmoid-upscaling=yes

# Subtitles & OSD
sub-auto=fuzzy
sub-font="DejaVu Sans"
osd-font="DejaVu Sans"
osd-bar=no
