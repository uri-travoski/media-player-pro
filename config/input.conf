# Media Player Pro - Key & Mouse Bindings (v1.6)

# Mouse Controls (Double click fullscreen handled via Lua above seekbar; fallback ignore)
MBTN_LEFT_DBL ignore
WHEEL_UP    add volume 2
WHEEL_DOWN  add volume -2

# 5-Second Navigation
LEFT        seek -5
RIGHT       seek 5
Shift+LEFT  seek -30
Shift+RIGHT seek 30

# Playback Controls
SPACE       cycle pause
p           cycle pause
m           cycle mute
f           cycle fullscreen
ESC         set fullscreen no

# Enhancement shortcuts
e           script-binding glass_cycle_enhancement

# Viewport Transformation Shortcuts
ctrl+0      script-binding glass_zoom_reset
ctrl+1      script-binding glass_flip_horizontal
ctrl+2      script-binding glass_rotate_90
