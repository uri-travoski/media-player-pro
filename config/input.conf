# Media Player Pro - Key & Mouse Bindings (v1.1)

# Mouse Wheel Volume Controls
WHEEL_UP    add volume 2
WHEEL_DOWN  add volume -2

# 7-Second Navigation
LEFT        seek -7
RIGHT       seek 7
Shift+LEFT  seek -30
Shift+RIGHT seek 30

# Playback Controls
SPACE       cycle pause
p           cycle pause
m           cycle mute
f           cycle fullscreen
ESC         set fullscreen no

# Enhancement shortcuts
e           script-binding glass_cycle_enhancement

# Zoom & Pan shortcuts (handled directly in glass_zoom_pan.lua)
ctrl+0      script-binding glass_zoom_reset
