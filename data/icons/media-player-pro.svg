<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1814" />
      <stop offset="50%" stop-color="#0f0c0a" />
      <stop offset="100%" stop-color="#050403" />
    </linearGradient>

    <!-- Glass Glow Gradient -->
    <linearGradient id="glassGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>

    <!-- Amber Gold Accent Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Rounded Square Frame (Squircle) -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" stroke="#453a32" stroke-width="4" filter="url(#softShadow)" />

  <!-- Inner Frosted Glass Highlight -->
  <rect x="40" y="40" width="432" height="432" rx="104" fill="url(#glassGlow)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2" />

  <!-- Outer Ambient Amber Glow Ring -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="#f59e0b" stroke-width="12" stroke-opacity="0.3" filter="url(#glow)" />
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#amberGrad)" stroke-width="8" stroke-opacity="0.8" />

  <!-- Play Symbol Background Pill -->
  <circle cx="256" cy="256" r="110" fill="#140f0c" stroke="#5a4d42" stroke-width="3" />
  <circle cx="256" cy="256" r="110" fill="url(#glassGlow)" />

  <!-- Central Amber Play Triangle -->
  <polygon points="228,196 322,256 228,316" fill="url(#amberGrad)" filter="url(#glow)" />

  <!-- Subtle Glass Highlight Arc -->
  <path d="M 170 120 A 150 150 0 0 1 342 120" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.3" stroke-linecap="round" />
</svg>
